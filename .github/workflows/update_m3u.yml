name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: m3u-update
  cancel-in-progress: false

# Silence Node 20 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  update-m3u:
    # Pin to a known-good Ubuntu version so apt packages don't shift under you
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # works once requirements.txt exists

      - name: Install System Dependencies (ffmpeg/ffprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # requirements.txt contains: aiohttp>=3.9.0

      - name: Run Header-Aware M3U Checker
        id: checker
        continue-on-error: true        # <-- let us inspect logs even on failure
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python auto_m3u.py

      - name: Show Results Summary
        if: always()
        run: |
          echo "=== Generated files ==="
          ls -la working*.m3u 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Channel counts ==="
          for f in working*.m3u; do
            [ -f "$f" ] || continue
            count=$(grep -c '^#EXTINF' "$f" || true)
            echo "$f: $count channels"
          done
          echo ""
          echo "=== Last 50 lines of checker.log ==="
          tail -n 50 checker.log 2>/dev/null || echo "(no log)"

      - name: Fail if no output produced
        if: always()
        run: |
          if ! ls working*.m3u >/dev/null 2>&1; then
            echo "::error::Script produced no working_*.m3u files. Check logs above."
            exit 1
          fi

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add working*.m3u 2>/dev/null || true
          git add checker.log 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🚀 Auto Update: M3U playlists ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push attempt $i failed, retrying after rebase..."
            git pull --rebase --autostash || true
            sleep 5
          done

          echo "Push failed after retries." >&2
          exit 1

      - name: Upload artifacts (playlists + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u-playlists-${{ github.run_number }}
          path: |
            working*.m3u
            checker.log
          if-no-files-found: warn
          retention-days: 14
